services:
  - type: web
    name: skillnet-demo
    runtime: node
    rootDir: skill-network/demo
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Auth: 'signature' (default, Ed25519-signed writes) or 'dev' (legacy, no auth)
      - key: AUTH_MODE
        value: signature
      # Comma-separated CORS allow-list (same-origin is always allowed)
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      # Persisted state snapshot path (relative to rootDir; attach a Render disk
      # here to survive redeploys, otherwise it survives in-instance restarts only)
      - key: STATE_FILE
        value: data/state.json
      # Hedera HCS-26 publishing — leave empty to run in local-only mode;
      # fill in the dashboard later to enable the live registry.
      - key: HEDERA_ACCOUNT_ID
        sync: false
      - key: HEDERA_PRIVATE_KEY
        sync: false
      - key: HCS26_DISCOVERY_TOPIC
        sync: false
      # Settlement gateway (issue #2) — leave GATEWAY_PRIVATE_KEY empty to run
      # with the gateway disabled (demo works as before, no on-chain settling).
      # Fill it in the dashboard to enable batch settlement on Base Sepolia.
      - key: GATEWAY_PRIVATE_KEY
        sync: false
      - key: DEMO_PAYER_SEED
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: SETTLEMENT_VAULT_ADDRESS
        value: "0xb6DECc3e5d3a4E8a0F64DdFC5Fe8A6128abeb8B8"
      - key: TREASURY_ADDRESS
        value: "0x7a549A1687f374715C74615748509aF976a3f32E"
      # Settle when pending royalties reach this many wei (0.02 ETH), or when an
      # external cron POSTs /api/settle (which also wakes the free-tier instance).
      - key: SETTLE_THRESHOLD_WEI
        value: "20000000000000000"
